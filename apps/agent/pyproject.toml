[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "lyl-agent"
version = "0.1.0"
description = "Local LangGraph baseline for the LYL counsel agent"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "langchain>=1.2,<2",
  "langchain-openai>=1.1,<2",
  "langgraph>=1.0,<2",
  "pydantic-settings>=2.12,<3",
]

[dependency-groups]
dev = [
  "langgraph-cli[inmem]>=0.4,<1",
  "langgraph-sdk>=0.3,<1",
  "pytest>=9,<10",
  "pytest-asyncio>=1.3,<2",
]

[tool.hatch.build.targets.wheel]
packages = ["src/lyl_agent"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = ["live: calls the configured paid or remote LLM"]
